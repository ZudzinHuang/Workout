<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080808">
<title>Strength &amp; Skill</title>
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Strength and Skill&quot;,&quot;short_name&quot;:&quot;Train&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#080808&quot;,&quot;theme_color&quot;:&quot;#080808&quot;,&quot;start_url&quot;:&quot;.&quot;}">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#080808;color:#e0e0e0;font-family:'Courier New',monospace;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-thumb{background:#2a2a2a}
button{font-family:'Courier New',monospace;cursor:pointer;border:none;background:none}
a{text-decoration:none}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{position:sticky;top:0;z-index:50;background:#080808;border-bottom:1px solid #161616;padding:14px 16px 0}
.tabs{display:flex;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 12px;font-size:8px;letter-spacing:2px;text-transform:uppercase;background:none;border:none;border-bottom:2px solid transparent;color:#3a3a3a;cursor:pointer;margin-bottom:-1px;white-space:nowrap}
.tab.on{border-bottom-color:var(--c);color:var(--c)}
.wrap{max-width:580px;margin:0 auto;padding:16px 14px 80px}
.srow{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.srow::-webkit-scrollbar{display:none}
.dbtn{flex-shrink:0;padding:6px 10px;background:transparent;border:1px solid #1a1a1a;cursor:pointer}
.dbtn.on{background:#111;border-color:var(--c)}
.ex{padding:13px 0;border-bottom:1px solid #0e0e0e}
.extop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.how{flex-shrink:0;background:transparent;border:1px solid var(--c33);color:var(--caa);font-size:9px;letter-spacing:1px;padding:5px 9px;cursor:pointer;font-family:inherit}
.dots{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px}
.dot{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:9px;border:1px solid #252525;color:#2e2e2e;transition:all .2s}
.dot.on{border-color:var(--c);background:var(--c2a);color:var(--c)}
.sdone{padding:5px 11px;font-size:9px;letter-spacing:1px;font-family:inherit;border:1px solid var(--c33);background:var(--c18);color:var(--c);cursor:pointer}
.rst{padding:3px 7px;font-size:9px;font-family:inherit;background:transparent;border:1px solid #222;color:#444;cursor:pointer}
.tw{background:#080808;border:1px solid #1e1e1e;padding:12px 14px;margin-top:8px;display:flex;gap:14px;align-items:center;transition:border-color .3s}
.tw.run{border-color:var(--c55)}
.tc{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tb{padding:5px 11px;font-size:9px;letter-spacing:2px;font-family:inherit;cursor:pointer}
.tb1{background:var(--c1a);border:1px solid var(--c44);color:var(--c)}
.tb2{background:#200808;border:1px solid #5a1515;color:#f87171}
.tb3{background:transparent;border:1px solid #1e1e1e;color:#444;padding:5px 8px}
.ov{position:fixed;inset:0;background:#000d;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.mb{background:#0d0d0d;border:1px solid var(--c44);max-width:360px;width:100%;padding:18px}
.mi{width:100%;max-height:260px;object-fit:contain;background:#f8f8f8;display:block}
.mn{height:160px;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#444;font-size:11px}
.yt{display:block;margin-top:12px;text-align:center;font-size:9px;letter-spacing:2px;color:var(--caa);padding-top:12px;border-top:1px solid #1e1e1e}
.card{padding:11px 13px;background:#0a0a0a;border:1px solid #141414;margin-bottom:10px}
.hero{padding:18px 16px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid var(--c22)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:14px}
.wc{padding:6px 2px;text-align:center;border:1px solid #141414;background:#0a0a0a}
.wc.now{border-color:var(--c)}
.lvl{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #0e0e0e}
.lvbox{width:20px;height:20px;border:1px solid #252525;display:flex;align-items:center;justify-content:center;font-size:9px;color:#2e2e2e;flex-shrink:0;cursor:pointer}
.lvbox.hit{border-color:var(--c);background:var(--c2a);color:var(--c)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ═══ PROGRAM DATA ═══════════════════════════════════════════════════════════
// 6-day rotation. Skill primer FIRST (fresh CNS), then heavy compounds, then
// accessories as supersets to fit 30 min.

const DAYS = [
  {
    key:"pushA", label:"DAY 1", name:"Push A", sub:"Chest · Shoulders · Triceps",
    tag:"PUSH", color:"#4ade80", bg:"#041a0e",
    focus:"Heavy horizontal press + handstand primer",
    notes:"Skill primer first while fresh. Bench heavy, dips to failure. Last set of everything goes to failure \u2014 that's your growth signal on a cut.",
    ex:[
      {name:"Wrist + shoulder warm-up",sets:"—",reps:"3 min",rest:0,skill:1},
      {name:"Wall Handstand Hold",sets:"3",reps:"20–40 sec",rest:60,skill:1},
      {name:"Barbell Bench Press",sets:"4",reps:"6–10",rest:90},
      {name:"Dips (bench or parallettes)",sets:"3",reps:"AMRAP",rest:90},
      {name:"Dumbbell Shoulder Press",sets:"3",reps:"8–12",rest:75},
      {name:"Lateral Raise + Overhead Tricep Ext (superset)",sets:"2",reps:"12–15 each",rest:60},
    ]
  },
  {
    key:"pullA", label:"DAY 2", name:"Pull A", sub:"Back · Biceps · Pull-up focus",
    tag:"PULL", color:"#60a5fa", bg:"#060f1e",
    focus:"Pull-up strength is the #1 priority — this is your bottleneck",
    notes:"Negatives are the fastest driver from 2 pull-ups to 8. Jump to the top, lower for a full 5 seconds. Stop the set when you can no longer control the descent.",
    ex:[
      {name:"Dead Hang",sets:"2",reps:"20–30 sec",rest:45,skill:1},
      {name:"Scapular Pull-ups",sets:"2",reps:"8–10",rest:45,skill:1},
      {name:"Pull-up Negatives (5 sec lower)",sets:"4",reps:"3–5",rest:90,skill:1},
      {name:"Lat Pulldown (heavy)",sets:"4",reps:"8–12",rest:90},
      {name:"Barbell or Dumbbell Row",sets:"3",reps:"8–12",rest:75},
      {name:"Face Pull + Preacher Curl (superset)",sets:"2",reps:"12–15 each",rest:60},
    ]
  },
  {
    key:"legsA", label:"DAY 3", name:"Legs A", sub:"Quads · Hamstrings · Core",
    tag:"LEGS", color:"#f97316", bg:"#180a02",
    focus:"Squat pattern + L-sit progression",
    notes:"Legs matter on a cut — they're your biggest muscle group and drive the metabolic signal. Don't skip these days.",
    ex:[
      {name:"L-sit Tuck Hold (on handles)",sets:"3",reps:"15–25 sec",rest:60,skill:1},
      {name:"Barbell Back Squat",sets:"4",reps:"8–12",rest:90},
      {name:"Romanian Deadlift",sets:"3",reps:"8–12",rest:90},
      {name:"Leg Extension",sets:"2",reps:"12–15",rest:60},
      {name:"Hanging Knee Raise",sets:"3",reps:"10–15",rest:60},
    ]
  },
  {
    key:"pushB", label:"DAY 4", name:"Push B", sub:"Shoulders · Chest · Triceps",
    tag:"PUSH", color:"#4ade80", bg:"#041a0e",
    focus:"Vertical press emphasis + handstand volume",
    notes:"Overhead pressing builds the shoulder strength that handstands and muscle-ups demand. Pike push-ups bridge the gap to freestanding work.",
    ex:[
      {name:"Wall Handstand Hold (chest-to-wall)",sets:"3",reps:"20–40 sec",rest:60,skill:1},
      {name:"Pike Push-ups (feet elevated)",sets:"3",reps:"6–12",rest:75,skill:1},
      {name:"Overhead Barbell Press",sets:"4",reps:"6–10",rest:90},
      {name:"Incline Dumbbell Press",sets:"3",reps:"8–12",rest:75},
      {name:"Deficit Push-ups (on handles)",sets:"2",reps:"AMRAP",rest:60},
      {name:"Lateral Raise",sets:"2",reps:"15–20",rest:45},
    ]
  },
  {
    key:"pullB", label:"DAY 5", name:"Pull B", sub:"Back · Biceps · Explosive pull",
    tag:"PULL", color:"#60a5fa", bg:"#060f1e",
    focus:"Explosive pulling — the muscle-up pathway",
    notes:"Once you can do 5+ clean pull-ups, swap negatives for explosive pull-ups here. Pull as high as possible, aiming for chest-to-bar. That height is what becomes a muscle-up.",
    ex:[
      {name:"Explosive Pull-up Attempts (or negatives)",sets:"4",reps:"2–4",rest:120,skill:1},
      {name:"Chin-ups / Assisted Pull-ups",sets:"3",reps:"AMRAP",rest:90},
      {name:"Chest-Supported Row (bench)",sets:"3",reps:"10–12",rest:75},
      {name:"Straight-Arm Pulldown",sets:"2",reps:"12–15",rest:60},
      {name:"Dumbbell Hammer Curl",sets:"2",reps:"10–12",rest:60},
    ]
  },
  {
    key:"legsB", label:"DAY 6", name:"Legs B + Core", sub:"Unilateral · Posterior · Flag prep",
    tag:"LEGS", color:"#f97316", bg:"#180a02",
    focus:"Single-leg work + human flag foundation",
    notes:"Human flag is mostly obliques and lat strength. Side plank and hanging work here build that base long before you touch a vertical pole.",
    ex:[
      {name:"L-sit Progression (tuck → one leg)",sets:"3",reps:"15–25 sec",rest:60,skill:1},
      {name:"Bulgarian Split Squat",sets:"3",reps:"8–12 each leg",rest:75},
      {name:"Dumbbell Romanian Deadlift",sets:"3",reps:"10–12",rest:75},
      {name:"Leg Extension / Leg Curl",sets:"2",reps:"12–15",rest:60},
      {name:"Side Plank (weighted if easy)",sets:"3",reps:"30–45 sec each",rest:45,skill:1},
      {name:"Hollow Body Hold",sets:"2",reps:"20–30 sec",rest:45,skill:1},
    ]
  },
  {
    key:"rest", label:"DAY 7", name:"Rest", sub:"Recovery",
    tag:"REST", color:"#38bdf8", bg:"#0a1520",
    focus:"Full rest or light walking",
    notes:"On a deficit, recovery is not optional. Sleep 7–9 hours, hit your protein, walk if you want but don't train. This is where the muscle you're protecting actually holds on.",
    ex:[
      {name:"Walk (optional)",sets:"—",reps:"20–40 min",rest:0},
      {name:"Full body stretch",sets:"—",reps:"10–15 min",rest:0},
    ]
  },
];

const TAGC = {
  PUSH:{bg:"#0a1a10",t:"#4ade80",b:"#134d23"},
  PULL:{bg:"#0a0a20",t:"#818cf8",b:"#2d2b7a"},
  LEGS:{bg:"#1a0d00",t:"#fb923c",b:"#7c2d12"},
  REST:{bg:"#0a1520",t:"#38bdf8",b:"#075985"},
};

// Mon..Sun -> day index
const DOW = {1:0,2:1,3:2,4:3,5:4,6:5,0:6};

const SKILLS = [
  { name:"Pull-up → Muscle-up", color:"#60a5fa",
    why:"Your main bottleneck. Everything upstream unlocks from here.",
    levels:[
      "2 strict pull-ups (you are here)",
      "5 strict pull-ups",
      "8 strict pull-ups",
      "12 strict pull-ups",
      "Chest-to-bar pull-ups × 5",
      "Explosive pull-up to lower ribs",
      "Muscle-up negatives × 3",
      "First clean muscle-up",
    ]},
  { name:"Handstand → L-sit to Handstand", color:"#4ade80",
    why:"Built from wrist tolerance, shoulder strength, and straight-line control.",
    levels:[
      "Wall handstand 30 sec",
      "Chest-to-wall handstand 45 sec",
      "Handstand shoulder taps × 10",
      "Freestanding kick-up + 3 sec",
      "Freestanding 10 sec",
      "Tuck planche press attempt",
      "L-sit to tuck handstand",
      "Full L-sit to handstand",
    ]},
  { name:"L-sit", color:"#f97316",
    why:"Pure compression strength + hip flexors. Trains fast with frequency.",
    levels:[
      "Tuck L-sit 15 sec",
      "Tuck L-sit 30 sec",
      "One leg extended 15 sec",
      "Full L-sit 10 sec",
      "Full L-sit 20 sec",
      "L-sit on parallettes 30 sec",
    ]},
  { name:"Human Flag", color:"#e879f9",
    why:"Long-term goal. Obliques and lats do the work, not arms.",
    levels:[
      "Side plank 60 sec",
      "Vertical bar support hold 10 sec",
      "Tuck flag 5 sec",
      "Tuck flag 12 sec",
      "One leg extended 5 sec",
      "Straddle flag 3 sec",
      "Full human flag",
    ]},
];

const CUTTING = [
  {i:"🥩",t:"Protein",v:"160–180g / day",d:"Higher than a normal cut. On a deficit, protein is the single strongest signal telling your body to keep muscle instead of burning it. Aim ~1g per lb of bodyweight."},
  {i:"🔥",t:"Deficit size",v:"300–500 kcal below maintenance",d:"Resist going steeper. Aggressive deficits strip muscle and tank your training performance — which is exactly the strength signal you can't afford to lose right now."},
  {i:"🏋️",t:"Keep the weight heavy",v:"Don't drop load to chase reps",d:"The most common cutting mistake. Lighter weight + higher reps feels productive but removes the mechanical tension that preserves muscle. Keep your working weights, accept fewer reps."},
  {i:"🍚",t:"Carbs around training",v:"Most carbs pre/post workout",d:"Training performance drops on a deficit. Putting most of your carbs near your session keeps intensity up when it matters most."},
  {i:"😴",t:"Sleep",v:"7–9 hours",d:"Under-slept and under-fed together is the fastest way to lose muscle. If you can only fix one recovery variable, fix this one."},
  {i:"📉",t:"Expected rate",v:"0.5–1 lb per week",d:"At 178 lbs that's the sweet spot. Faster than this and you're likely losing muscle alongside fat. Weigh weekly, not daily — and take the weekly average."},
];

const SEARCH={
"Wall Handstand Hold":"handstand","Wall Handstand Hold (chest-to-wall)":"handstand",
"Barbell Bench Press":"bench press","Dips (bench or parallettes)":"dips",
"Dumbbell Shoulder Press":"dumbbell shoulder press","Dead Hang":"dead hang",
"Scapular Pull-ups":"scapular pull up","Pull-up Negatives (5 sec lower)":"pull up",
"Lat Pulldown (heavy)":"lat pulldown","Barbell or Dumbbell Row":"barbell row",
"L-sit Tuck Hold (on handles)":"l sit","Barbell Back Squat":"squat",
"Romanian Deadlift":"romanian deadlift","Leg Extension":"leg extension",
"Hanging Knee Raise":"hanging knee raise","Pike Push-ups (feet elevated)":"pike push up",
"Overhead Barbell Press":"overhead press","Incline Dumbbell Press":"incline dumbbell press",
"Deficit Push-ups (on handles)":"push up","Lateral Raise":"lateral raise",
"Explosive Pull-up Attempts (or negatives)":"pull up","Chin-ups / Assisted Pull-ups":"chin up",
"Chest-Supported Row (bench)":"chest supported row","Straight-Arm Pulldown":"straight arm pulldown",
"Dumbbell Hammer Curl":"hammer curl","L-sit Progression (tuck → one leg)":"l sit",
"Bulgarian Split Squat":"bulgarian split squat","Dumbbell Romanian Deadlift":"romanian deadlift",
"Leg Extension / Leg Curl":"leg curl","Side Plank (weighted if easy)":"side plank",
"Hollow Body Hold":"hollow body","Full body stretch":"stretching",
"Lateral Raise + Overhead Tricep Ext (superset)":"lateral raise",
"Face Pull + Preacher Curl (superset)":"face pull",
};

// ═══ STATE ══════════════════════════════════════════════════════════════════
let state={ di:todayIdx(), tab:"today", modal:null, sets:{}, timers:{}, holds:{}, levels:{} };
const imgCache={};

function todayIdx(){ return DOW[new Date().getDay()]; }
function D(){ return DAYS[state.di]; }
function C(){ return D().color; }

// ═══ TIMER ENGINE (rAF + wall clock — throttle proof) ═══════════════════════
let rafId=null;
function tObj(k){ return k.startsWith('h-') ? state.holds[k.slice(2)] : state.timers[k]; }
function tick(){
  rafId=requestAnimationFrame(tick);
  const keys=[...Object.keys(state.timers),...Object.keys(state.holds).map(k=>'h-'+k)];
  for(const k of keys){
    const t=tObj(k); if(!t||!t.running) continue;
    const el=(Date.now()-t.at)/1000;
    const nr=Math.max(0,t.from-el), pr=t.rem;
    t.rem=nr;
    if(nr<=0&&pr>0){ t.rem=0; t.running=false; render(); continue; }
    if(Math.ceil(nr)!==Math.ceil(pr)) patch(k,t);
  }
}
function startRaf(){ if(!rafId) rafId=requestAnimationFrame(tick); }
function patch(k,t){
  const w=document.getElementById('t-'+k); if(!w){ render(); return; }
  const R=28,c=2*Math.PI*R, arc=w.querySelector('circle:last-child'), n=w.querySelector('.tn');
  if(arc){ arc.setAttribute('stroke-dashoffset',(c*(1-t.rem/t.secs)).toFixed(2)); arc.setAttribute('stroke',t.running?C():'#333'); }
  if(n) n.textContent=Math.ceil(t.rem)+'s';
}
function tStart(k,h){
  const rk=h?k.slice(2):k, st=h?state.holds:state.timers, t=st[rk]; if(!t) return;
  t.running=true; t.at=Date.now(); t.from=t.rem; startRaf();
}
function tPause(k,h){
  const rk=h?k.slice(2):k, st=h?state.holds:state.timers, t=st[rk]; if(!t) return;
  if(t.running&&t.at){ t.rem=Math.max(0,t.from-(Date.now()-t.at)/1000); }
  t.running=false;
}
function tReset(k,h){
  const rk=h?k.slice(2):k, st=h?state.holds:state.timers, t=st[rk]; if(!t) return;
  t.rem=t.secs; t.running=false; t.at=null;
}
function tAdj(k,h,d){
  const rk=h?k.slice(2):k, st=h?state.holds:state.timers, t=st[rk]; if(!t) return;
  if(t.running&&t.at){ t.rem=Math.max(0,t.from-(Date.now()-t.at)/1000); }
  t.secs=Math.max(5,t.secs+d);
  t.rem=Math.max(0,Math.min(t.secs,t.rem+d));
  if(t.running){ t.at=Date.now(); t.from=t.rem; }
}

// ═══ HELPERS ════════════════════════════════════════════════════════════════
function holdSecs(reps){
  if(!reps) return 0;
  const m=reps.match(/(\d+)\s*[–\-]?\s*(\d+)?\s*sec/i);
  if(!m) return 0;
  const lo=+m[1], hi=m[2]?+m[2]:lo;
  return Math.round((lo+hi)/2);
}
function setVars(){
  const c=C(), r=document.documentElement.style;
  r.setProperty('--c',c); r.setProperty('--c33',c+'33'); r.setProperty('--caa',c+'aa');
  r.setProperty('--c1a',c+'1a'); r.setProperty('--c44',c+'44'); r.setProperty('--c55',c+'55');
  r.setProperty('--c18',c+'18'); r.setProperty('--c2a',c+'2a'); r.setProperty('--c22',c+'22');
}

// ═══ RENDER ═════════════════════════════════════════════════════════════════
function render(){
  setVars();
  document.getElementById('app').innerHTML=
    head()+`<div class="wrap">`+
    (state.tab==='today'?today():'')+
    (state.tab==='train'?train():'')+
    (state.tab==='skills'?skills():'')+
    (state.tab==='cut'?cut():'')+
    `</div>`+(state.modal?modal():'');
  bind();
}

function head(){
  const d=D();
  return `<div class="bar"><div style="max-width:580px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;align-items:flex-end">
      <div>
        <div style="font-size:7px;letter-spacing:4px;color:#3a3a3a;margin-bottom:2px">STRENGTH &amp; SKILL</div>
        <div style="font-size:17px;font-weight:900"><span style="color:${d.color}">6-DAY ROTATION</span></div>
      </div>
      <div style="text-align:right;font-size:8px;color:#3a3a3a;letter-spacing:1px;line-height:1.6">
        30 MIN / DAY<br><span style="color:${d.color}">${d.name.toUpperCase()}</span>
      </div>
    </div>
    <div class="tabs">
      ${[['today','today'],['train','workouts'],['skills','skills'],['cut','cutting']].map(([k,l])=>
        `<button class="tab ${state.tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}
    </div>
  </div></div>`;
}

function today(){
  const now=new Date(), ti=todayIdx(), d=DAYS[ti], t=TAGC[d.tag];
  const dn=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dow=now.getDay(), mon=new Date(now); mon.setDate(now.getDate()-((dow+6)%7));
  let cells='';
  for(let i=0;i<7;i++){
    const dd=new Date(mon); dd.setDate(mon.getDate()+i);
    const isNow=dd.toDateString()===now.toDateString();
    const dayObj=DAYS[DOW[dd.getDay()]];
    cells+=`<div class="wc ${isNow?'now':''}" data-goto="${DOW[dd.getDay()]}" style="${isNow?`background:${dayObj.color}0d`:''}">
      <div style="font-size:7px;color:${isNow?dayObj.color:'#3a3a3a'}">${dn[dd.getDay()]}</div>
      <div style="font-size:11px;font-weight:900;color:${isNow?dayObj.color:'#555'};margin:2px 0">${dd.getDate()}</div>
      <div style="font-size:7px;color:${isNow?dayObj.color:'#2e2e2e'}">${dayObj.tag}</div>
    </div>`;
  }
  const isRest=d.tag==='REST';
  return `<div class="hero" style="background:linear-gradient(135deg,${d.bg} 0%,#080808 100%)">
      <div style="font-size:8px;letter-spacing:3px;color:${d.color};margin-bottom:8px">TODAY · ${dn[now.getDay()]} ${now.getDate()} ${mo[now.getMonth()].toUpperCase()}</div>
      <div style="font-size:9px;color:#444;letter-spacing:2px;margin-bottom:4px">${d.label} OF 7</div>
      <div style="font-size:24px;font-weight:900;color:${d.color};line-height:1;margin-bottom:5px">${d.name.toUpperCase()}</div>
      <div style="font-size:13px;color:#aaa;margin-bottom:10px">${d.sub}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <span style="font-size:8px;letter-spacing:1px;padding:3px 8px;background:${t.bg};color:${t.t};border:1px solid ${t.b}">${d.tag}</span>
        ${!isRest?`<span style="font-size:10px;color:#555">${d.ex.length} exercises · ~30 min</span>`:''}
      </div>
      <button data-goto="${ti}" style="padding:8px 16px;font-size:9px;letter-spacing:2px;font-family:inherit;background:${d.color}18;border:1px solid ${d.color}44;color:${d.color};cursor:pointer">
        ${isRest?'VIEW RECOVERY →':"GO TO TODAY'S WORKOUT →"}
      </button>
    </div>
    <div style="font-size:7px;letter-spacing:2px;color:#3a3a3a;margin-bottom:6px">THIS WEEK</div>
    <div class="wk">${cells}</div>
    <div class="card">
      <div style="font-size:7px;letter-spacing:2px;color:#3a3a3a;margin-bottom:8px">THE ROTATION</div>
      ${DAYS.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;${i<6?'border-bottom:1px solid #0e0e0e':''}">
        <div style="font-size:11px;color:${i===ti?x.color:'#999'}">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]} · ${x.name}</div>
        <div style="font-size:9px;color:${x.color}88">${x.sub.split(' · ')[0]}</div>
      </div>`).join('')}
    </div>
    <div class="card" style="background:#0a0f0a;border-color:#162016">
      <div style="font-size:7px;letter-spacing:2px;color:#4ade80;margin-bottom:6px">WHILE CUTTING</div>
      <div style="font-size:11px;color:#888;line-height:1.7">Keep your working weights heavy and take the last set of every exercise to failure. Fewer reps at the same load is normal on a deficit — dropping the weight is what costs you muscle.</div>
    </div>`;
}

function train(){
  const d=D(), t=TAGC[d.tag];
  return `<div class="srow" style="margin-bottom:14px">
      ${DAYS.map((x,i)=>`<button class="dbtn ${state.di===i?'on':''}" data-day="${i}" style="${state.di===i?`border-color:${x.color}`:''}">
        <div style="font-size:7px;color:${state.di===i?x.color:'#333'}">${x.label}</div>
        <div style="font-size:9px;color:${state.di===i?'#ccc':'#333'};white-space:nowrap">${x.name}</div>
      </button>`).join('')}
    </div>
    <div style="background:${d.bg};border:1px solid ${d.color}1a;padding:10px 13px;margin-bottom:12px">
      <div style="font-size:7px;color:${d.color};letter-spacing:2px;margin-bottom:4px">FOCUS</div>
      <div style="font-size:11px;color:#999;line-height:1.5">${d.focus}</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid #141414;margin-bottom:12px">
      <div>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">
          <span style="font-size:7px;color:#3a3a3a;letter-spacing:2px">${d.label}</span>
          <span style="font-size:7px;letter-spacing:1px;padding:2px 7px;background:${t.bg};color:${t.t};border:1px solid ${t.b}">${d.tag}</span>
        </div>
        <div style="font-size:16px;font-weight:900">${d.name}</div>
        <div style="font-size:10px;color:#555;margin-top:2px">${d.sub}</div>
      </div>
    </div>
    ${d.ex.map((e,i)=>exRow(e,i)).join('')}
    <div class="card" style="margin-top:14px">
      <div style="font-size:7px;letter-spacing:2px;color:#3a3a3a;margin-bottom:5px">NOTES</div>
      <div style="font-size:11px;color:#666;line-height:1.7">${d.notes}</div>
    </div>`;
}

function exRow(e,i){
  const d=D(), k=state.di+'-'+i;
  const done=state.sets[k]||0, tot=parseInt(e.sets)||0;
  const hs=holdSecs(e.reps), hasHold=hs>0&&tot>0;
  const rt=state.timers[k], bx=state.timers['bx-'+k], ht=state.holds[k];
  const bxRest=e.rest>0?e.rest+15:0;

  let dots='';
  if(tot>0&&e.rest>0){
    const dd=Array.from({length:tot},(_,j)=>`<div class="dot ${j<done?'on':''}">${j+1}</div>`).join('');
    const btn=done<tot
      ?`<button class="sdone" data-set="${k}" data-rest="${e.rest}" data-tot="${tot}" data-bx="${bxRest}">SET ${done+1} ✓</button>`
      :`<div style="display:flex;gap:7px;align-items:center"><span style="font-size:9px;color:${d.color}">✓ DONE</span><button class="rst" data-clr="${k}">↺</button></div>`;
    dots=`<div class="dots">${dd}${btn}</div>`;
  }

  let hold='';
  if(hasHold){
    hold = (ht&&ht.show)
      ? timerHTML('h-'+k,ht,'HOLD TIMER')
      : `<div style="margin-top:7px"><button data-hold="${k}" data-hs="${hs}" style="padding:5px 12px;font-size:9px;letter-spacing:2px;font-family:inherit;background:${d.color}10;border:1px solid ${d.color}33;color:${d.color}88;cursor:pointer">⏱ HOLD ${hs}s</button></div>`;
  }

  return `<div class="ex">
    <div class="extop">
      <div style="flex:1">
        <div style="font-size:13px;color:${e.skill?d.color:'#ddd'};margin-bottom:4px;line-height:1.4">${e.skill?'◆ ':''}${e.name}</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <span style="font-size:10px;color:#444">${e.sets} sets</span>
          <span style="font-size:10px;color:${d.color}">× ${e.reps}</span>
          ${e.rest>0?`<span style="font-size:9px;color:#333">rest ${e.rest}s</span>`:''}
        </div>
      </div>
      ${SEARCH[e.name]!==undefined?`<button class="how" data-ex="${encodeURIComponent(e.name)}">▶ HOW</button>`:''}
    </div>
    ${hold}${dots}
    ${rt&&rt.show&&done<tot?timerHTML(k,rt,'REST BETWEEN SETS'):''}
    ${bx&&bx.show?timerHTML('bx-'+k,bx,'REST BEFORE NEXT EXERCISE'):''}
  </div>`;
}

function timerHTML(k,t,label){
  const R=28,circ=2*Math.PI*R, off=circ*(1-t.rem/t.secs);
  const fin=t.rem===0, isH=label.includes('HOLD');
  const dc=isH?'#facc15':'#f87171', dt=isH?'DONE!':'GO!';
  return `<div class="tw ${t.running?'run':''}" id="t-${k}">
    <div style="position:relative;width:64px;height:64px;flex-shrink:0">
      <svg width="64" height="64" style="transform:rotate(-90deg)">
        <circle cx="32" cy="32" r="${R}" fill="none" stroke="#1a1a1a" stroke-width="3.5"/>
        <circle cx="32" cy="32" r="${R}" fill="none" stroke="${fin?dc:t.running?C():'#333'}" stroke-width="3.5"
          stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" stroke-linecap="round"
          style="transition:stroke-dashoffset 1s linear,stroke .3s"/>
      </svg>
      <div class="tn" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:${fin?10:14}px;font-weight:900;color:${fin?dc:t.running?C():'#555'}">${fin?dt:Math.ceil(t.rem)+'s'}</div>
    </div>
    <div style="flex:1">
      <div style="font-size:8px;letter-spacing:2px;color:#3a3a3a;margin-bottom:7px">${label}</div>
      <div class="tc">
        ${!fin?`<button class="tb ${t.running?'tb2':'tb1'}" data-t="${t.running?'pause':'start'}" data-tk="${k}">${t.running?'PAUSE':t.rem<t.secs?'RESUME':'START'}</button>`:''}
        ${(fin||(!t.running&&t.rem<t.secs))?`<button class="tb tb3" data-t="reset" data-tk="${k}">↺</button>`:''}
        <button class="tb tb3" data-t="sub" data-tk="${k}">−15s</button>
        <button class="tb tb3" data-t="add" data-tk="${k}">+15s</button>
        <button class="tb tb3" data-t="close" data-tk="${k}">✕</button>
      </div>
    </div>
  </div>`;
}

function skills(){
  return `<div style="font-size:7px;letter-spacing:3px;color:#3a3a3a;margin-bottom:6px">SKILL LADDERS</div>
    <div style="font-size:11px;color:#666;line-height:1.7;margin-bottom:16px">Tap a level when you hit it. No dates — you advance when you earn it, not when a calendar says so.</div>
    ${SKILLS.map((s,si)=>`
      <div class="card" style="border-color:${s.color}22">
        <div style="font-size:11px;color:${s.color};letter-spacing:1px;margin-bottom:3px;font-weight:900">${s.name}</div>
        <div style="font-size:10px;color:#555;line-height:1.6;margin-bottom:10px">${s.why}</div>
        ${s.levels.map((lv,li)=>{
          const hit=state.levels[si+'-'+li];
          return `<div class="lvl">
            <div class="lvbox ${hit?'hit':''}" data-lv="${si}-${li}" style="${hit?`border-color:${s.color};background:${s.color}2a;color:${s.color}`:''}">${hit?'✓':li+1}</div>
            <div style="font-size:11px;color:${hit?'#ccc':'#666'};line-height:1.4">${lv}</div>
          </div>`;
        }).join('')}
      </div>`).join('')}
    <div class="card" style="background:#1a0d00;border-color:#7c2d12">
      <div style="font-size:7px;letter-spacing:2px;color:#fb923c;margin-bottom:6px">⚠ EQUIPMENT WARNING</div>
      <div style="font-size:11px;color:#999;line-height:1.7">A door-mounted pull-up bar is not rated for muscle-ups. The swing and dynamic load can tear it off the frame. Use it for pull-ups, negatives, hangs, and leg raises only — find a proper mounted bar or outdoor park bar before attempting muscle-ups.</div>
    </div>`;
}

function cut(){
  return `<div style="font-size:7px;letter-spacing:3px;color:#3a3a3a;margin-bottom:6px">CUTTING WITHOUT LOSING MUSCLE</div>
    <div style="font-size:11px;color:#666;line-height:1.7;margin-bottom:14px">You can't build much muscle in a deficit — but you can hold nearly all of it, get meaningfully stronger, and look dramatically better as fat comes off. These are the levers that matter.</div>
    ${CUTTING.map(x=>`<div class="card" style="display:flex;gap:12px;align-items:flex-start">
      <span style="font-size:20px">${x.i}</span>
      <div>
        <div style="font-size:7px;letter-spacing:2px;color:#3a3a3a;margin-bottom:2px">${x.t.toUpperCase()}</div>
        <div style="font-size:13px;font-weight:900;color:#e0e0e0;margin-bottom:5px">${x.v}</div>
        <div style="font-size:11px;color:#666;line-height:1.6">${x.d}</div>
      </div>
    </div>`).join('')}
    <div class="card" style="background:#080f08;border-color:#162016">
      <div style="font-size:7px;letter-spacing:2px;color:#4ade80;margin-bottom:8px">PROTEIN TARGETS · ~170G</div>
      ${[['Chicken breast','200g','62g'],['Greek yogurt 0%','250g','25g'],['Whey shake','1 scoop','25g'],['Eggs','4 large','24g'],['Lean beef / salmon','200g','45g']].map((r,i,a)=>
        `<div style="display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:7px 0;${i<a.length-1?'border-bottom:1px solid #162016':''}">
          <div style="font-size:11px;color:#bbb">${r[0]}</div>
          <div style="font-size:10px;color:#555">${r[1]}</div>
          <div style="font-size:10px;color:#4ade80;min-width:34px;text-align:right">${r[2]}</div>
        </div>`).join('')}
    </div>`;
}

function modal(){
  const m=state.modal, yt=`https://www.youtube.com/results?search_query=${encodeURIComponent(m.name+' proper form tutorial')}`;
  return `<div class="ov" id="ov"><div class="mb">
    <div style="display:flex;justify-content:space-between;margin-bottom:12px">
      <div style="font-size:11px;color:#999;max-width:85%;line-height:1.4">${m.name}</div>
      <button id="mx" style="background:none;border:none;color:#555;font-size:20px;cursor:pointer;line-height:1">×</button>
    </div>
    ${m.loading?`<div class="mn"><div style="font-size:28px">⏳</div><div>Loading…</div></div>`
      :m.url?`<img class="mi" src="${m.url}" alt="">`
      :`<div class="mn"><div style="font-size:32px">🏋️</div><div>No image found</div></div>`}
    <a class="yt" href="${yt}" target="_blank">WATCH TUTORIAL ON YOUTUBE ↗</a>
  </div></div>`;
}

// ═══ EVENTS ═════════════════════════════════════════════════════════════════
function bind(){
  document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{ state.tab=e.dataset.tab; render(); });
  document.querySelectorAll('[data-day]').forEach(e=>e.onclick=()=>{ state.di=+e.dataset.day; state.holds={}; render(); });
  document.querySelectorAll('[data-goto]').forEach(e=>e.onclick=()=>{ state.di=+e.dataset.goto; state.tab='train'; state.holds={}; render(); window.scrollTo(0,0); });

  document.querySelectorAll('[data-set]').forEach(e=>e.onclick=()=>{
    const k=e.dataset.set, rest=+e.dataset.rest, tot=+e.dataset.tot, bx=+e.dataset.bx;
    state.sets[k]=(state.sets[k]||0)+1;
    const n=state.sets[k];
    if(n<tot&&rest>0){ state.timers[k]={show:1,secs:rest,rem:rest,running:0}; tStart(k); }
    else if(n>=tot&&bx>0){ state.timers['bx-'+k]={show:1,secs:bx,rem:bx,running:0}; tStart('bx-'+k); }
    render();
  });

  document.querySelectorAll('[data-clr]').forEach(e=>e.onclick=()=>{
    const k=e.dataset.clr;
    delete state.sets[k]; delete state.timers[k]; delete state.timers['bx-'+k]; delete state.holds[k];
    render();
  });

  document.querySelectorAll('[data-hold]').forEach(e=>e.onclick=()=>{
    const k=e.dataset.hold, s=+e.dataset.hs;
    state.holds[k]={show:1,secs:s,rem:s,running:0};
    tStart('h-'+k,1); render();
  });

  document.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{
    const k=e.dataset.tk, a=e.dataset.t, h=k.startsWith('h-');
    const rk=h?k.slice(2):k, st=h?state.holds:state.timers;
    if(!st[rk]) return;
    if(a==='start') tStart(k,h);
    else if(a==='pause') tPause(k,h);
    else if(a==='reset') tReset(k,h);
    else if(a==='sub') tAdj(k,h,-15);
    else if(a==='add') tAdj(k,h,15);
    else if(a==='close'){ tPause(k,h); if(h) delete state.holds[rk]; else st[rk].show=0; }
    render();
  });

  document.querySelectorAll('[data-lv]').forEach(e=>e.onclick=()=>{
    const k=e.dataset.lv;
    if(state.levels[k]) delete state.levels[k]; else state.levels[k]=1;
    save(); render();
  });

  document.querySelectorAll('[data-ex]').forEach(e=>e.onclick=async()=>{
    const name=decodeURIComponent(e.dataset.ex);
    if(imgCache[name]!==undefined){ state.modal={name,url:imgCache[name],loading:0}; render(); return; }
    state.modal={name,url:null,loading:1}; render();
    let url=null; const term=SEARCH[name];
    if(term){
      try{
        const r=await fetch(`https://wger.de/api/v2/exercise/search/?term=${encodeURIComponent(term)}&language=english&format=json`);
        const j=await r.json(); const id=j.suggestions?.[0]?.data?.id;
        if(id){
          const r2=await fetch(`https://wger.de/api/v2/exerciseimage/?exercise_base=${id}&format=json`);
          const j2=await r2.json(); if(j2.results?.length) url=j2.results[0].image;
        }
      }catch(err){}
    }
    imgCache[name]=url;
    if(state.modal&&state.modal.name===name){ state.modal={name,url,loading:0}; render(); }
  });

  const ov=document.getElementById('ov');
  if(ov) ov.onclick=ev=>{ if(ev.target===ov||ev.target.id==='mx'){ state.modal=null; render(); } };
}

// ═══ PERSIST LEVELS ═════════════════════════════════════════════════════════
function save(){ try{ localStorage.setItem('skillLevels',JSON.stringify(state.levels)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem('skillLevels'); if(s) state.levels=JSON.parse(s); }catch(e){} }

load(); startRaf(); render();
</script>
